services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-oban}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-oban_elixir}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oban} -d ${DB_NAME:-oban_elixir}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Required — set these in Coolify env vars or a local .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      WINDMILL_TOKEN: ${WINDMILL_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY}
      # Postgres — points to the service above
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oban_elixir}
      DB_USER: ${DB_USER:-oban}

volumes:
  postgres_data:
